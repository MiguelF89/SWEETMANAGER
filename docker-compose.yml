version: '3.8'

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    working_dir: /var/www

    volumes:
      - ./LARAVEL:/var/www

    ports:
      - "8000:8000"

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: laravel
      DB_USERNAME: root
      DB_PASSWORD: root

    depends_on:
      mysql:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - sweetnet

  vite:
    build:
      context: .
      dockerfile: Dockerfile

    working_dir: /var/www

    volumes:
      - ./LARAVEL:/var/www

    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

    ports:
      - "5173:5173"

    depends_on:
      - app

    restart: unless-stopped

    networks:
      - sweetnet

  mysql:
    image: mysql:8.0

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

    restart: unless-stopped

    networks:
      - sweetnet

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest

    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "8080:80"

    depends_on:
      mysql:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - sweetnet

volumes:
  mysql_data:

networks:
  sweetnet:
    driver: bridge  